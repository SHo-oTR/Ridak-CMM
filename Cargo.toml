[package]
name = "rust_pcdmis_cmm"
version = "0.1.0"
edition = "2021"
description = "PC-DMIS tarzı 3B CAD Görüntüleyici, OpenCASCADE STEP/IGES Yükleyici, Sanal Prob ve CMM Metroloji Yazılımı"
authors = ["CMM Metrology Engineer"]

[features]
default = []
# Sistemde CMake ve C++ derleyicisi / OpenCASCADE kurulu olduğunda STEP ve IGES B-Rep
# dosyalarını doğrudan OpenCASCADE çekirdeği ile okumak için:
# cargo run --release --features occt
occt = ["dep:opencascade", "dep:opencascade-sys"]

[dependencies]
# 3B PBR Grafik Motoru ve Sahne Yönetimi
bevy = { version = "0.15", default-features = true }

# PC-DMIS Benzeri Kenetlenebilir (Dockable) Arayüz Altyapısı
bevy_egui = "0.31"
egui_dock = "0.15"

# Metroloji, SVD Düzlem/Daire Uydurma ve Doğrusal Cebir Çözücü
nalgebra = "0.33"

# Yerel Dosya Seçici (STEP / IGES İçe Aktarma Diyaloğu)
rfd = "0.15"

# OpenCASCADE CAD Çekirdeği Bağlantıları (STEP ve IGES B-Rep Triangülasyonu)
opencascade = { version = "0.2", optional = true }
opencascade-sys = { version = "0.2", optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
